name: CI – Build, Test & Dockerize

on:
  push:
    branches: ["main", "docker-1"]
  pull_request:
    branches: ["main", "docker-1"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysqldb:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "$$idMySQL231"
          MYSQL_DATABASE: wellness
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Build JAR
        working-directory: AuthenticationJwt
        run: mvn clean package -DskipTests

      - name: Run Tests
        working-directory: AuthenticationJwt
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/wellness?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: "$$idMySQL231"
        run: mvn test

      - name: Build Docker image
        working-directory: AuthenticationJwt
        run: docker build -f Dockerfile -t sidharth2314/my-org:wellness-auth-1.0 .

      - name: Tag latest
        run: docker tag sidharth2314/my-org:wellness-auth-1.0 sidharth2314/my-org:latest

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docker-1'
        uses: docker/login-action@v3
        with:
          username: sidharth2314
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docker-1'
        run: |
          docker push sidharth2314/my-org:wellness-auth-1.0
          docker push sidharth2314/my-org:latest
